
name: Build AL3med ESP Lab APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          unzip -o AL3med_ESP_Lab_CloudBuild_Phone.zip
          ls -la

      - name: Build APK
        working-directory: AL3med_ESP_Lab_APK_Project
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AL3med-ESP-Lab-APK
          path: AL3med_ESP_Lab_APK_Project/app/build/outputs/apk/debug/app-debug.apk
